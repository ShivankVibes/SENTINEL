[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel"
version = "0.1.0"
description = "Autonomous AI Hazard Detection and Response System"
authors = [{ name = "SENTINEL Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.10.0",
    "numpy>=1.26.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "websockets>=12.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.3",
    "requests>=2.31.0",
]

[tool.setuptools.packages.find]
include = ["sentinel*"]
exclude = ["config*", "firmware*", "tests*", "data*"]
