# SENTINEL - Rover Dynamics & Control Configuration

rover:
  model: "SENTINEL-MK1"
  # Physical dimensions for collision modeling (in cm)
  width_cm: 16.0
  length_cm: 18.0
  wheel_diameter_cm: 6.5
  wheel_base_cm: 14.0

navigation:
  # Closed loop control tolerances
  position_tolerance_cm: 8.0      # Arrival threshold
  heading_tolerance_deg: 12.0     # Angular tolerance before straight drive
  max_forward_speed_cm_s: 20.0
  rotation_speed_deg_s: 45.0
  replan_distance_threshold_cm: 15.0 # Re-trigger A* if rover drifts off path
  control_loop_frequency_hz: 10

comms:
  # ESP32 Communication parameters
  protocol: "websocket"           # "websocket" or "rest"
  esp32_ip: "192.168.4.1"         # Default AP or local LAN IP
  esp32_port: 8080
  heartbeat_interval_sec: 0.2     # 200ms keepalive
  command_timeout_sec: 0.6        # Trigger emergency stop if lost
  retry_count: 3

simulation:
  enabled: true                   # Start in safe simulation mode by default
  speed_multiplier: 1.0
  add_simulated_noise: false
  mock_ultrasonic_max_range_cm: 150.0
  mock_ultrasonic_min_range_cm: 4.0
